<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>检测记录统计</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<style>
  .wrap { margin:16px 20px 40px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
  .kpis { display:flex; gap:12px; flex-wrap:wrap; margin:8px 0 16px; }
  .kpi { border:1px solid var(--line); border-radius:8px; padding:10px 14px; min-width:120px; }
  .kpi b { display:block; font-size:22px; }
  .bar { display:inline-block; height:8px; background:var(--ok); border-radius:4px; vertical-align:middle; margin-right:6px; }
  .filters { display:flex; gap:12px; align-items:center; flex-wrap:wrap; font-size:14px; }
  .filters select { padding:4px 6px; }
</style>
</head>
<body>
<header>
  <h1>检测记录与反馈统计</h1>
  <a class="tag link" href="./">返回检测</a>
</header>
<div class="wrap">
  <div class="filters">
    <label>时间 <select id="days"><option value="">全部</option><option value="1">最近 1 天</option><option value="7" selected>最近 7 天</option><option value="30">最近 30 天</option></select></label>
    <label>岗位 <select id="job"><option value="">全部</option></select></label>
    <span id="dir" class="muted small"></span>
  </div>
  <div id="out"><p class="muted">加载中…</p></div>
</div>
<script type="module" src="records.js"></script>
</body>
</html>
