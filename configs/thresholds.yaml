# 判定阈值。初值来自网页 demo 的经验值，必须用 M0 实测数据校准（见 docs/VALIDATION.md 第 7 节）。
# 网页 demo 读取的是由本文件生成的 apps/web-demo/config.generated.json：
# 改完本文件后运行 `limbcheck export-web-config`，否则 tests/test_config.py 会失败。
version: 1

capture:
  hold_ms: 1000              # 动作保持多久算到位
  step_timeout_ms: 25000     # 单步超时
  challenge_round_ms: 5000   # 随机手势挑战每轮时限
  challenge_rounds: 2

quality:
  brightness: [60, 215]      # 画面平均亮度（0–255）允许范围
  blur_laplacian_min: 80     # 拉普拉斯方差低于此值视为模糊（建议初值，未经实测）
  max_persons: 1
  min_hand_size: 0.07        # 掌长 / 画面高度，低于此值提示走近

pose:
  min_visibility: 0.55       # 关键点可见度阈值
  limb_symmetry: [0.75, 1.33]  # 左右肢段长度比正常范围
  foot_min_visibility: 0.4   # 脚跟、脚尖点可见度阈值（鞋子、地面遮挡时略低，建议初值）
  min_straight_angle: 120    # 站立 / 侧平举 / 上举时肘、膝角度下限（度），低于此值判"弯折"（疑似远端缺失、关键点折回）
  contour_min: 0.5           # 肢体每段采样点落在人体分割掩码内的比例下限，低于此值判"疑似缺失（关键点脑补）"

fingers:
  # 各手指链长 / 中指链长 的参考比例（MCP→指尖，拇指 CMC→指尖）
  ref: {thumb: 0.95, index: 0.88, middle: 1.0, ring: 0.93, little: 0.72}
  short_factor: 0.6          # 低于 参考 × 0.6 记"疑似缺失或短缩"
  middle_to_palm_min: 0.45   # 中指链长 / 掌长（腕→中指 MCP）下限
  extended_angle: 145        # 非拇指 MCP-PIP-TIP 夹角大于此值算伸直
  thumb_extended_angle: 140
  pinch_ratio: 0.32          # 拇指尖与目标指尖距离 / 掌长 < 此值算对捏

contour:
  tip_on_mask_min: 0.5       # 手指末节、中节采样点落在手部掩码（皮肤）内的比例下限，低于此值判"看不清（遮挡 / 蜷起 / 缺失，关键点脑补）"
  gap_min_spread: 0.33       # 相邻两指末节中点距离 ≥ 0.33 掌长（已张开）时，两指之间应能看到背景；看不到判"疑似遮挡（关键点脑补）"
  palm_on_mask_min: 0.75     # 掌面内部采样点落在手部掩码内的比例下限，低于此值判"疑似手掌 / 手背残缺"（建议初值，未经实测）
  skin_delta_e: 20           # skin 后端：与手背肤色的 Lab 色差上限
  mask_dilate_px: 3

nails:
  delta_e: 22                # 指甲与手背肤色 Lab 色差，超过记"疑似美甲"

hair:
  dyed_chroma_min: 18        # 头发像素平均彩度高于此值记"疑似染色"（粗略启发式，只作基线）
  min_pixels: 400            # 头发像素少于此值视为无法判断

# 肢体协调性：分析动作步骤里记录的关键点序列（limbcheck/motion.py）。角度单位度，长度以大腿 / 腿长 / 躯干长 / 肩宽为单位。
# 均为建议初值，需要用真人样本（含动作不协调、活动受限者）校准。
motion:
  min_frames: 8              # 一个动作至少多少帧才分析
  min_vis: 0.5               # 关键点可见度低于此值的帧不参与计算
  arms: {t_min_abduction: 70, up_min_abduction: 140, max_asym_deg: 25, min_elbow: 140}   # 侧平举 / 上举外展角下限，左右差上限，肘部伸直下限
  legs: {min_lift: 0.5, max_asym: 0.35, max_sway: 0.15}       # 抬腿比例（大腿抬平 = 1）、左右差、抬腿时髋部左右晃动（躯干长）
  squat: {min_depth: 0.25, max_knee_asym_deg: 25, max_shift: 0.15}   # 下蹲深度（腿长）、最低点左右膝角差、身体侧移（躯干长）
  march: {lift: 0.35, min_count: 6, min_alternation: 0.7, max_cv: 0.45, max_count_diff: 2}   # 高抬腿：抬腿判定、次数、左右交替比例、间隔变异系数、左右次数差
  cross_touch: {touch_ratio: 0.45, min_count: 4, min_alternation: 0.7, max_cv: 0.5}         # 交叉摸肩：手腕到对侧肩距离 < 0.45 肩宽算摸到
  confidence: {normal: 0.85, normal_single: 0.7, abnormal: 0.6}   # 结论置信度：≥ 2 个身体动作都正常 / 只有 1 个 / 发现问题

multi_frame: {window: 9, vote: 0.6}   # 建议：9 帧中 ≥60% 一致才采纳（实时链路用，离线评测为单帧）

arbitration:
  strategy: default          # 仲裁策略（limbcheck/arbiter.py；自定义策略见 docs/EXTENDING.md）
  high_conf: 0.8             # 所有来源都认为正常且置信度都 ≥ 此值才自动通过
  auto_fail_conf: 0.85       # 认为有问题且置信度 ≥ 此值 → 直接判"不符合"，低于此值转人工；null 表示一律转人工
  auto_fail_single_source: false   # 默认策略只有一路模型时是否也直接判（关键点会"脑补"手指，默认要求两路一致）
  # high_conf、auto_fail_conf 随筛选严格度变化，见 configs/strictness.yaml
  low_conf: 0.5              # 两路不一致且一方低于此值时优先重做
  max_redo: 1
  per_check:                 # 按检测项覆盖上面的值
    tattoo: {strategy: policy}               # 按录用标准（configs/policies/marks.yaml）逐处判定
    scar: {strategy: policy, high_conf: 0.9} # 疤痕大模型误报多，要求更高置信度才自动通过
