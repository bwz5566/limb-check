# 风险筛查问询（《AI面试需求》"其他"表第 8 项）：识别到疤痕才触发，无疤痕自动跳过；语气温和、不刺激。
# 网页 demo 在所有动作做完、大模型复核出结果后，如果任一视角标出了疤痕，随机播报一句问题并录下受检者的口头回答（只录声音），
# 录音附在报告里供 HR 参考，不参与自动判定。改问题、时长只改这里：改完运行 `limbcheck export-web-config`。
version: 1
scar:
  enabled: true
  questions:
    - 身上的疤痕是什么原因造成的，可以简单说明一下吗？
    - 手臂上面这个伤疤是怎么来的？
    - 麻烦说明一下这个疤痕形成的原因。
    - 这个疤什么时候弄的，是什么情况造成的？
  answer_ms: 20000        # 回答录音最长时长；受检者可以提前点"回答完毕"
  record_audio: true      # false：只播报问题、不录音（由 HR 线下追问）
