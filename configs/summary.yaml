# 肢体正常综合判断：把各检测项、动作步骤的结论汇总成一个总结论（limbcheck/summary.py）。
# 改汇总方式只改这里：改完运行 `limbcheck export-web-config`，再跑 pytest。
version: 1

# 报告顶部按模块汇总（按顺序）。checks 为 configs/checks.json 的检测项，steps 为网页 demo 的动作步骤（没完成 → 需人工复核）。
groups:
  - {id: limbs,    name: 四肢,       checks: [limbs, coordination], steps: [arms, cross_touch, legs, march, squat]}
  - {id: hands,    name: 手部,       checks: [fingers], steps: [palms, backs, flex, pinch]}
  - {id: nails,    name: 指甲,       checks: [nails], steps: [nails]}
  - {id: hair,     name: 头发,       checks: [hair], steps: [hair]}
  - {id: marks,    name: 纹身 / 疤痕, checks: [tattoo, scar], steps: [neck, arms_close]}
  - {id: liveness, name: 活体 / 防作弊, checks: [liveness], steps: [challenge]}

# 入职前可以整改的检测项：判"不符合"或"疑似问题"时不淘汰，给"有条件通过"并写明整改要求。
# 例如头发也允许入职前染回：加一行 `hair: 入职前需将头发染回自然色`
fixable:
  nails: 入职前需卸除美甲、修剪指甲

# 总结论（按顺序判断，第一个满足的生效）：
#   fail：有不可整改的项目明确不符合（保留申诉和线下复核渠道）
#   manual：有项目需人工复核或待人工确认
#   redo：有项目需重做（画质、姿势不满足）
#   conditional：只有可整改的项目不符合
#   pass：全部满足
outcomes:
  fail:        {name: 不符合, text: 有项目明确不符合岗位要求；候选人可申诉或申请线下复核}
  manual:      {name: 待人工确认, text: 系统不能确定的项目请人工查看证据后确认}
  redo:        {name: 需重做, text: 部分画面不清楚或姿势不到位，请重新检测相关步骤}
  conditional: {name: 有条件通过, text: 其余项目均满足，入职前需完成整改}
  pass:        {name: 通过, text: 各项均满足岗位要求}
  none:        {name: 未评估, text: 没有按判定模式评估的项目}
