id: precision
name: 精密装配
description: 需双手十指完成抓握与捏取等精细操作
requirements:
  - 双手十指能完成抓握与捏取
  - 上肢活动正常
  - 入职前需卸除美甲
strictness: standard        # 筛选严格度 strict / standard / lenient（configs/strictness.yaml），可按场次临时切换
steps: [env, stand, back, arms, cross_touch, neck, hair, arms_close, palms, backs, nails, flex, pinch, challenge]
checks:
  limbs:    {enabled: true, mode: judge, params: {upper: true, lower: false}}
  coordination: {enabled: true, mode: judge}   # 动作序列分析（configs/thresholds.yaml 的 motion 段）；只有关键点一路，发现问题只建议人工确认
  fingers:  {enabled: true, mode: judge, params: {pinch: true}}
  nails:    {enabled: true, mode: judge}         # 结论是"入职前需卸除"，不作淘汰条件
  tattoo:   {enabled: true, mode: judge}         # 按录用标准判定（书面依据见 basis）
  scar:     {enabled: true, mode: judge, params: {fine_work: true}}   # 精细作业：长条手术刀疤按不录用处理
  hair:     {enabled: true, mode: judge}         # 发色、发长按录用标准判定（configs/policies/hair.yaml）；男生长发规则需招聘方填写性别
  liveness: {enabled: true, mode: judge}
# 外观项（纹身、疤痕、发色）的书面依据。为空时这些项只能是 record_only。
basis:
  - {checks: [tattoo, scar], doc: "纹身 / 疤痕录用标准（招聘方提供，2026-10）", clause: "configs/policies/marks.yaml"}
  - {checks: [hair], doc: "发色 / 发长要求（招聘方提供，2026-10：红紫绿黄等过曝光色不录用，棕褐、黑色正常；男生不留长发）", clause: "configs/policies/hair.yaml"}
