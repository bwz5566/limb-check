id: precision
name: 精密装配
description: 需双手十指完成抓握与捏取等精细操作
requirements:
  - 双手十指能完成抓握与捏取
  - 上肢活动正常
  - 入职前需卸除美甲
steps: [env, stand, back, arms, palms, backs, flex, pinch, challenge]
checks:
  limbs:    {enabled: true, mode: judge, params: {upper: true, lower: false}}
  fingers:  {enabled: true, mode: judge, params: {pinch: true}}
  nails:    {enabled: true, mode: judge}         # 结论是"入职前需卸除"，不作淘汰条件
  tattoo:   {enabled: true, mode: record_only}   # 书面依据落实前只记录
  scar:     {enabled: true, mode: record_only}
  hair:     {enabled: true, mode: record_only}
  liveness: {enabled: true, mode: judge}
# 外观项（纹身、疤痕、发色）的书面依据。为空时这些项只能是 record_only，
# 例：- {checks: [tattoo], doc: "员工手册（2025 版）", clause: "第 3.2 条"}
basis: []
